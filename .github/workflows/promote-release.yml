name: Publish verified packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Verify and package run whose source tree matches this tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v1.')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERIFIED_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_version.py "$RELEASE_TAG"
      - run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/verify_release_source.py "$VERIFIED_RUN"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-*
          path: release-artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the already tested image archives and desktop packages
        run: |
          version="${RELEASE_TAG#v}"
          find release-artifacts -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*portable.zip' -o -name '*_docker.tar.gz' \) -exec cp '{}' . \;
          for arch in amd64 arm64; do
            docker load -i "DeChord_${version}_linux_${arch}_docker.tar.gz"
            docker tag "ghcr.io/chinmaykrishnroy/dechord:$version" "ghcr.io/chinmaykrishnroy/dechord:${RELEASE_TAG}-$arch"
            docker push "ghcr.io/chinmaykrishnroy/dechord:${RELEASE_TAG}-$arch"
            docker image rm "ghcr.io/chinmaykrishnroy/dechord:$version" "ghcr.io/chinmaykrishnroy/dechord:${RELEASE_TAG}-$arch"
          done
          docker buildx imagetools create --tag "ghcr.io/chinmaykrishnroy/dechord:$version" --tag ghcr.io/chinmaykrishnroy/dechord:latest "ghcr.io/chinmaykrishnroy/dechord:${RELEASE_TAG}-amd64" "ghcr.io/chinmaykrishnroy/dechord:${RELEASE_TAG}-arm64"
          sha256sum ./*.exe ./*.deb ./*.AppImage ./*portable.zip ./*_docker.tar.gz compose.yaml > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.exe ./*.deb ./*.AppImage ./*portable.zip ./*_docker.tar.gz compose.yaml SHA256SUMS.txt --verify-tag --title "DeChord $RELEASE_TAG" --notes-file RELEASE_NOTES.md
