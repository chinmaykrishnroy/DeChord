name: Verify and package
on:
  push:
    branches: [main, pro-backend-foundation]
    tags: ['v1.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.ref_name }}
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt ruff
      - run: python scripts/check_version.py
      - run: ruff check --select F,E9 backend scripts tests
      - run: ruff format --check backend scripts tests
      - run: python -m unittest discover -s tests -v
  desktop:
    needs: [frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb dbus-x11 ffmpeg libfuse2t64
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
      - run: python -m pip install -r backend/requirements-desktop.txt
      - run: python scripts/build_engine.py
      - if: runner.os == 'Windows'
        run: python scripts/smoke_engine.py frontend/src-tauri/resources/engine/dechord-engine.exe
      - if: runner.os == 'Linux'
        run: python scripts/smoke_engine.py frontend/src-tauri/resources/engine/dechord-engine
      - run: cargo fmt --check
        working-directory: frontend/src-tauri
      - run: npm ci
        working-directory: frontend
      - if: runner.os == 'Windows'
        run: npm run tauri:build -- --config src-tauri/tauri.release.conf.json --bundles nsis
        working-directory: frontend
      - if: runner.os == 'Linux'
        run: |
          # linuxdeploy scans private PyInstaller ELF files outside the bootloader.
          # Give its resolver the same library directories the engine uses.
          engine_libs="$(find "$PWD/src-tauri/resources/engine/_internal" -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd:)"
          LD_LIBRARY_PATH="$engine_libs:${LD_LIBRARY_PATH:-}" npm run tauri:build -- --verbose --config src-tauri/tauri.release.conf.json --bundles deb,appimage
        working-directory: frontend
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - if: runner.os == 'Windows'
        run: |
          python scripts/package_portable.py
          python scripts/smoke_desktop.py build/portable/DeChord/dechord.exe
      - if: runner.os == 'Linux'
        run: |
          sudo dpkg -i frontend/src-tauri/target/release/bundle/deb/*.deb
          xvfb-run -a dbus-run-session -- python scripts/smoke_desktop.py /usr/bin/dechord
          xvfb-run -a dbus-run-session -- python scripts/smoke_desktop.py frontend/src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          compression-level: 0
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/resources/engine/DEPENDENCIES.txt
            build/releases/*portable.zip
          if-no-files-found: error
  web-image:
    needs: [frontend, backend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dechord:test
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}
      - run: docker run -d --name dechord-test -p 127.0.0.1:8765:8765 dechord:test
      - run: python3 scripts/smoke_web.py
      - if: always()
        run: docker logs dechord-test
      - if: startsWith(github.ref, 'refs/tags/v1.')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: startsWith(github.ref, 'refs/tags/v1.')
        run: |
          docker tag dechord:test "ghcr.io/chinmaykrishnroy/dechord:${RELEASE_TAG}-${{ matrix.arch }}"
          docker push "ghcr.io/chinmaykrishnroy/dechord:${RELEASE_TAG}-${{ matrix.arch }}"
  release:
    if: startsWith(github.ref, 'refs/tags/v1.')
    needs: [desktop, web-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_version.py "$RELEASE_TAG"
      - run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          version="${RELEASE_TAG#v}"
          docker buildx imagetools create --tag "ghcr.io/chinmaykrishnroy/dechord:$version" --tag ghcr.io/chinmaykrishnroy/dechord:latest "ghcr.io/chinmaykrishnroy/dechord:${RELEASE_TAG}-amd64" "ghcr.io/chinmaykrishnroy/dechord:${RELEASE_TAG}-arm64"
          find release-artifacts -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*portable.zip' \) -exec cp '{}' . \;
          sha256sum ./*.exe ./*.deb ./*.AppImage ./*portable.zip > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.exe ./*.deb ./*.AppImage ./*portable.zip SHA256SUMS.txt --verify-tag --title "DeChord $RELEASE_TAG" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
